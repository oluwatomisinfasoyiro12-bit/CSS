<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Menu</title>

    <style>
        body {
            font-family: Arial;
            background: #fff8f0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #e65c00;
        }

        h1+p {
            background: #ffe0b2;
            padding: 10px 20px;
            border-radius: 8px;
            color: #bf360c;
            display: inline-block;
        }

        ul {
            padding: 0;
            margin-top: 20px;
        }

        ul>li {
            background: #fff3e0;
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            margin: 6px auto;
            padding: 10px 20px;
            border-radius: 8px;
            width: 260px;
        }

        ul li:nth-child(3) {
            background: #ffe082;
            color: #e65c00;
        }

        .desc {
            color: #555;
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .desc::first-letter {
            font-size: 220%;
            color: #e65c00;
            font-weight: bold;
        }

        .links {
            margin-top: 25px;
        }

        a {
            color: #e65c00;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 8px 18px;
            border: 2px solid #e65c00;
            border-radius: 8px;
        }

        a:hover {
            background: #e65c00;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>My food menu</h1>
    <p>Pick Your favourite dish and dig in</p>

    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Pasta</li>
        <li>Salad</li>
        <li>Ice Cream</li>
    </ul>

    <p class="desc">Every dish in this menu is made with love and lots of flavor. Try them all and find your favorite!
    </p>

    <div class="links">
        <a href="#">Order Now</a>
        <a href="#">See More</a>
    </div>
</body>

</html>
