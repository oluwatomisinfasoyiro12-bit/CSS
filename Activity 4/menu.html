<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resturant Menu Card</title>
    <style>
        body {
            background-color: darkblue;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }

        .tagline {
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }

        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }

        .power {
            font-weight: bold;
            color: lightgreen;
        }

        .weakness {
            text-decoration: line-through;
            color: green;
        }

        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        .made-by {
            color: coral;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1 class="ressturant name">Nacho Ball</h1>
    <p class="tagline">The most attractive resturant in the universe</p>

    <h2 class="label">Menu</h2>

    <p class="power">We offer differnt types of nachos</p>
    <p class="power">Nacho meat ball,
        Nacho fish ball,</p>

    <h2 class="label">Menu List</h2>
    <p class="power">We also offers</p>
    <p calss="power">French Fries
        Parfait
        Smoothies
        Pizza
    </p>

    <h2 class="label">Weaknesses</h2>

    <p class="weakness">Chicken Republic</p>
    <p class="weakness">rotten food</p>

    <p class="badge">Top Notch Resturant</p>
    <p class="made-by">Created by: Fasoyiro Daniel</p>
</body>

</html>
